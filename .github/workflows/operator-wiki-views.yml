name: Archive daily Wiki views

on:
  schedule:
    - cron: '17 0 * * *'  # 09:17 JST
    - cron: '37 6 * * *'  # 15:37 JST, recovery
    - cron: '47 12 * * *' # 21:47 JST, recovery
  workflow_dispatch:

concurrency:
  group: operator-wiki-views
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RECOVER_YESTERDAY: ${{ github.event_name == 'schedule' && github.event.schedule != '17 0 * * *' && 'true' || 'false' }}
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
      - name: Set up Node
        id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Collect and archive Wiki views
        if: env.RECOVER_YESTERDAY != 'true'
        run: npm run refresh:operator-wiki-views
      - name: Recover missing Wiki views for yesterday
        if: env.RECOVER_YESTERDAY == 'true'
        run: npm run refresh:operator-wiki-views -- --recover-yesterday
      - name: Collect Wiki comments
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        continue-on-error: true
        run: |
          if [ "$RECOVER_YESTERDAY" = true ]; then
            npm run refresh:operator-wiki-comments -- --if-stale
          else
            npm run refresh:operator-wiki-comments
          fi
      - name: Save collected data
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        id: save
        run: |
          git add -- public/data/operator-wiki-views.json public/data/operator-wiki-views-history/
          if [ -f public/data/operator-wiki-comments.json ]; then
            git add -- public/data/operator-wiki-comments.json
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Archive daily Wiki views"
          git fetch origin refs/heads/main
          git merge-base --is-ancestor HEAD^ FETCH_HEAD
          git rebase FETCH_HEAD
          git push origin HEAD:refs/heads/main
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Refresh the published site
        if: ${{ !cancelled() && steps.save.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
