name: Archive daily Wiki views

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

concurrency:
  group: operator-wiki-views
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Collect and archive Wiki views
        run: npm run refresh:operator-wiki-views
      - name: Collect Wiki comments
        continue-on-error: true
        run: npm run refresh:operator-wiki-comments
      - name: Save collected data
        run: |
          git add -- public/data/operator-wiki-views.json public/data/operator-wiki-views-history/ public/data/operator-wiki-comments.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Archive daily Wiki views"
          git fetch origin refs/heads/main
          git merge-base --is-ancestor HEAD^ FETCH_HEAD
          git rebase FETCH_HEAD
          git push origin HEAD:refs/heads/main
      - name: Refresh the published site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
