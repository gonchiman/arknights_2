name: Archive daily enemy Wiki stats

on:
  schedule:
    - cron: '17 1 * * *'  # 10:17 JST
    - cron: '37 7 * * *'  # 16:37 JST, recovery
    - cron: '7 13 * * *'  # 22:07 JST, recovery
  workflow_dispatch:

concurrency:
  group: enemy-wiki-stats
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 105
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Collect enemy Wiki views and comments
        id: collect
        timeout-minutes: 95
        # Let the collector flush its checkpoint before the Actions step timeout.
        run: timeout --signal=INT --kill-after=1m 90m npm run refresh:enemy-wiki-stats -- --daily
      - name: Save collected data
        if: ${{ !cancelled() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure') }}
        id: save
        run: |
          git add -- public/data/enemy-wiki-stats.json public/data/enemy-wiki-stats-history/
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Archive daily enemy Wiki stats"
          for attempt in 1 2 3; do
            git fetch origin refs/heads/main
            git merge-base --is-ancestor HEAD^ FETCH_HEAD
            git rebase FETCH_HEAD
            if git push origin HEAD:refs/heads/main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          exit 1
      - name: Refresh the published site
        if: ${{ !cancelled() && steps.save.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
